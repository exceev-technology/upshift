name: Upshift Branding Check

on:
  pull_request:
    branches: [upshift-main]
  push:
    branches: [upshift-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Resolve the latest Twenty tag
        id: release
        run: echo "twenty-tag=$(bash upshift/scripts/latest-twenty-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Check out Twenty ${{ steps.release.outputs.twenty-tag }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: twentyhq/twenty
          ref: refs/tags/${{ steps.release.outputs.twenty-tag }}
          path: .upshift-check/twenty-release
          persist-credentials: false

      - name: Apply the layer to the latest Twenty release and check its translations
        run: node upshift/scripts/apply-branding.mjs --root .upshift-check/twenty-release --check-catalogs

      - name: Apply the layer to this branch
        run: node upshift/scripts/apply-branding.mjs --root .

  disable-twenty-workflows:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Disable workflows that are not part of Upshift
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          workflow_paths=$(gh api "repos/$REPOSITORY/actions/workflows" --paginate --jq '
            .workflows[]
            | select(.state == "active")
            | select(.path | startswith(".github/workflows/"))
            | select(.path | startswith(".github/workflows/upshift-") | not)
            | .path')

          if [ -z "$workflow_paths" ]; then
            echo "Only Upshift workflows are active."
            exit 0
          fi

          for workflow_path in $workflow_paths; do
            echo "Disabling $workflow_path"
            gh workflow disable "$(basename "$workflow_path")" --repo "$REPOSITORY"
          done
