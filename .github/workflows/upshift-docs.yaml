name: Upshift Docs

on:
  push:
    branches: [upshift-main]
    paths:
      - 'upshift/docs/**'
      - 'upshift/branding/**'
      - '.github/workflows/upshift-docs.yaml'
  pull_request:
    branches: [upshift-main]
    paths:
      - 'upshift/docs/**'
      - 'upshift/branding/**'
      - '.github/workflows/upshift-docs.yaml'
  workflow_run:
    workflows: [Upshift Release]
    types: [completed]
    branches: [upshift-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upshift-docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    # A failed release keeps the docs of the previous one
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the Upshift layer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Find the Upshift releases to document
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | node upshift/docs/versions.mjs)
          latest=$(head -n 1 <<< "$versions")

          if [ -z "$latest" ]; then
            echo "::error::No GitHub Release is an Upshift version (upshift/vX.Y.Z)"
            exit 1
          fi

          older=$(tail -n +2 <<< "$versions" | tr '\n' ' ')
          echo "Upshift docs: v$latest at the root, older versions: ${older:-none}"
          {
            echo "version=v$latest"
            echo "app-version=$latest"
            echo "twenty-tag=twenty/v$latest"
            echo "older=$older"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the Twenty sources of Upshift ${{ steps.release.outputs.version }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: twentyhq/twenty
          ref: refs/tags/${{ steps.release.outputs.twenty-tag }}
          path: .upshift-docs/twenty
          sparse-checkout: |
            packages/twenty-docs
            packages/twenty-shared/src/constants
            packages/twenty-server/src/engine/core-modules/upgrade/constants
          filter: blob:none
          persist-credentials: false

      - name: Check out the Twenty sources of the older Upshift versions
        env:
          OLDER: ${{ steps.release.outputs.older }}
        run: |
          for version in $OLDER; do
            checkout=".upshift-docs/twenty-$version"
            git clone -q --depth 1 --filter=blob:none --sparse --branch "twenty/v$version" \
              https://github.com/twentyhq/twenty.git "$checkout"
            git -C "$checkout" sparse-checkout set packages/twenty-docs \
              packages/twenty-shared/src/constants \
              packages/twenty-server/src/engine/core-modules/upgrade/constants
          done

      - name: Test the docs importer
        run: node --test upshift/docs/test/*.test.mjs

      - name: Build the docs of Upshift ${{ steps.release.outputs.version }} and its older versions
        env:
          APP_VERSION: ${{ steps.release.outputs.app-version }}
          OLDER: ${{ steps.release.outputs.older }}
        run: |
          older_arguments=()

          for version in $OLDER; do
            older_arguments+=(--older "$version=.upshift-docs/twenty-$version")
          done

          node upshift/docs/import-docs.mjs --root .upshift-docs/twenty --version "$APP_VERSION" "${older_arguments[@]}"

      # Mintlify deploys the docs-site branch; pull requests only prove the build
      - name: Publish the docs-site branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          site="$GITHUB_WORKSPACE/upshift/docs/site"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          mkdir -p "$RUNNER_TEMP/docs-site"
          cd "$RUNNER_TEMP/docs-site"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git fetch -q --depth 1 "$remote" docs-site 2>/dev/null; then
            git checkout -q -b docs-site FETCH_HEAD
            git rm -r -q .
          else
            git checkout -q --orphan docs-site
          fi

          cp -R "$site"/. .
          git add -A

          if git diff --cached --quiet; then
            echo "The docs-site branch already carries Upshift $VERSION from this layer."
            exit 0
          fi

          git commit -q -m "Docs of Upshift $VERSION from layer ${GITHUB_SHA::10}"
          git push -q "$remote" HEAD:docs-site
          echo "Published the docs of Upshift $VERSION to the docs-site branch."
