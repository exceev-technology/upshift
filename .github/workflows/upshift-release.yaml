name: Upshift Release

on:
  schedule:
    - cron: '30 6 * * *'
  pull_request:
    branches: [upshift-main]
    paths:
      - 'upshift/**'
      - '.github/workflows/upshift-release.yaml'
  workflow_dispatch:
    inputs:
      twenty-tag:
        description: Twenty tag to build, for example twenty/v2.45.6. Leave empty for the latest tag.
        required: false
        default: ''
      force:
        description: Rebuild even if this version is already published
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upshift-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      twenty-tag: ${{ steps.release.outputs.twenty-tag }}
      version: ${{ steps.release.outputs.version }}
      app-version: ${{ steps.release.outputs.app-version }}
      is-latest: ${{ steps.release.outputs.is-latest }}
      is-latest-in-minor: ${{ steps.release.outputs.is-latest-in-minor }}
      should-build: ${{ steps.published.outputs.should-build }}
      publish: ${{ steps.published.outputs.publish }}
      release-out-of-date: ${{ steps.release-state.outputs.out-of-date }}
    steps:
      - name: Check out the Upshift scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: upshift/scripts
          filter: blob:none
          persist-credentials: false

      - name: Resolve the Twenty version
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.twenty-tag }}
        run: |
          latest_tag=$(bash upshift/scripts/latest-twenty-tag.sh)

          tag="${REQUESTED_TAG:-$latest_tag}"
          case "$tag" in
            twenty/*) ;;
            v*) tag="twenty/$tag" ;;
          esac

          if ! [[ "$tag" =~ ^twenty/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a Twenty release tag: '$tag'"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags https://github.com/twentyhq/twenty.git "refs/tags/$tag" > /dev/null; then
            echo "::error::Twenty has no tag '$tag'"
            exit 1
          fi

          version="${tag#twenty/}"
          latest_in_minor=$(bash upshift/scripts/latest-twenty-tag.sh "${version%.*}")

          is_latest=false
          if [ "$tag" = "$latest_tag" ]; then
            is_latest=true
          fi

          is_latest_in_minor=false
          if [ "$tag" = "$latest_in_minor" ]; then
            is_latest_in_minor=true
          fi

          echo "Twenty version: $tag (latest: $latest_tag, latest in ${version%.*}: $latest_in_minor)"
          {
            echo "twenty-tag=$tag"
            echo "version=$version"
            echo "app-version=${version#v}"
            echo "is-latest=$is_latest"
            echo "is-latest-in-minor=$is_latest_in_minor"
          } >> "$GITHUB_OUTPUT"

      # Pull requests never publish, so their code never runs next to a registry credential
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Decide whether to build and publish
        id: published
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FORCE: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Pull request: build the image to test the layer, publish nothing."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published, nothing to do."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # A failed release step can leave an image without its Release, or a rebuilt image with a stale tag
      - name: Check that the GitHub Release matches the image
        id: release-state
        if: github.event_name != 'pull_request' && steps.published.outputs.publish == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          release_tag="upshift/$VERSION"
          image_revision=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Image}}' \
            | jq -r '[.. | .Labels? | objects | .["org.opencontainers.image.revision"] | strings] | first // empty' || true)

          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION has no GitHub Release yet; it will be created."
            echo "out-of-date=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha 2>/dev/null); then
            tag_commit=""
          fi

          if [ -n "$image_revision" ] && [ "$tag_commit" != "$image_revision" ]; then
            echo "$release_tag points at ${tag_commit:-nothing} but the image was built from $image_revision; it will be updated."
            echo "out-of-date=true" >> "$GITHUB_OUTPUT"
          else
            echo "out-of-date=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.should-build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out Twenty ${{ needs.resolve.outputs.twenty-tag }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: twentyhq/twenty
          ref: refs/tags/${{ needs.resolve.outputs.twenty-tag }}
          path: twenty
          persist-credentials: false

      - name: Check out the Upshift layer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: upshift-layer
          sparse-checkout: upshift
          filter: blob:none
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Apply the Upshift layer
        run: node upshift-layer/upshift/scripts/apply-branding.mjs --root twenty

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: twenty
          file: twenty/packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.resolve.outputs.app-version }}
          labels: |
            org.opencontainers.image.title=Upshift
            org.opencontainers.image.description=Upshift CRM, built on Twenty ${{ needs.resolve.outputs.twenty-tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.resolve.outputs.publish }}

      - name: Load the image for the smoke test
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: twenty
          file: twenty/packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.resolve.outputs.app-version }}
          load: true
          tags: ${{ env.IMAGE }}:smoke

      - name: Smoke test the image
        if: matrix.arch == 'amd64'
        working-directory: upshift-layer/upshift/docker
        env:
          SINK_LOG: ${{ runner.temp }}/twenty-hosts.log
          COMPOSE_PROJECT_NAME: upshift-smoke
        run: |
          sudo "$(command -v node)" ../scripts/smoke-host-sink.mjs "$SINK_LOG" > "$RUNNER_TEMP/sink.out" 2>&1 &

          printf 'TAG=smoke\nSERVER_URL=http://localhost:3000\nENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" > smoke.env

          # Telemetry and icons are switched on here on purpose: the code-level removal must hold anyway.
          # Twenty hosts resolve to the sink on the runner, and the outbound guard is opened so attempts reach it.
          cat > smoke.override.yml <<'EOF'
          x-smoke-environment: &smoke-environment
            TELEMETRY_ENABLED: "true"
            ALLOW_REQUESTS_TO_TWENTY_ICONS: "true"
            OUTBOUND_HTTP_ALLOWED_INTERNAL_HOSTS: "*"
          x-twenty-hosts: &twenty-hosts
            - twenty-telemetry.com:host-gateway
            - twenty-icons.com:host-gateway
            - twenty-companies.com:host-gateway
            - twenty-help-search.com:host-gateway
            - twenty.com:host-gateway
            - www.twenty.com:host-gateway
            - app.twenty.com:host-gateway
            - api.twenty.com:host-gateway
            - docs.twenty.com:host-gateway
            - twentyhq.github.io:host-gateway
          services:
            server:
              environment: *smoke-environment
              extra_hosts: *twenty-hosts
            worker:
              environment: *smoke-environment
              extra_hosts: *twenty-hosts
          EOF

          docker compose -f docker-compose.yml -f smoke.override.yml --env-file smoke.env up -d

          docker compose -f docker-compose.yml -f smoke.override.yml --env-file smoke.env \
            exec -T server node -e "fetch('https://twenty-telemetry.com/smoke-control').catch(() => {})"
          sleep 6
          if ! grep -q "twenty-telemetry.com" "$SINK_LOG"; then
            echo "::error::The sink did not see the control request, so the privacy check would prove nothing"
            exit 1
          fi

          node ../scripts/smoke-test.mjs --base-url http://localhost:3000 --sink-log "$SINK_LOG"

      - name: Show smoke test logs
        if: failure() && matrix.arch == 'amd64'
        working-directory: upshift-layer/upshift/docker
        env:
          COMPOSE_PROJECT_NAME: upshift-smoke
        run: |
          echo "--- connections to Twenty hosts:"
          cat "$RUNNER_TEMP/twenty-hosts.log" || true
          docker compose -f docker-compose.yml -f smoke.override.yml --env-file smoke.env logs --tail 200 || true

      - name: Export digest
        if: needs.resolve.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.resolve.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          IS_LATEST: ${{ needs.resolve.outputs.is-latest }}
          IS_LATEST_IN_MINOR: ${{ needs.resolve.outputs.is-latest-in-minor }}
          TWENTY_TAG: ${{ needs.resolve.outputs.twenty-tag }}
        run: |
          tags=(--tag "$IMAGE:$VERSION")
          if [ "$IS_LATEST_IN_MINOR" = "true" ]; then
            tags+=(--tag "$IMAGE:${VERSION%.*}")
          fi
          if [ "$IS_LATEST" = "true" ]; then
            tags+=(--tag "$IMAGE:${VERSION%%.*}" --tag "$IMAGE:latest")
          fi
          echo "Publishing: ${tags[*]}"

          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=Upshift CRM, built on Twenty $TWENTY_TAG" \
            $(printf "$IMAGE@sha256:%s " *)

          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          IS_LATEST: ${{ needs.resolve.outputs.is-latest }}
          IS_LATEST_IN_MINOR: ${{ needs.resolve.outputs.is-latest-in-minor }}
          TWENTY_TAG: ${{ needs.resolve.outputs.twenty-tag }}
        run: |
          {
            echo "### Published $IMAGE:$VERSION"
            echo "- Built from Twenty \`$TWENTY_TAG\` with the Upshift layer from \`$GITHUB_SHA\`"
            echo "- Also tagged \`${VERSION%.*}\`: $IS_LATEST_IN_MINOR"
            echo "- Also tagged \`${VERSION%%.*}\` and \`latest\`: $IS_LATEST"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [resolve, publish]
    if: >-
      !cancelled() && (
        (needs.resolve.outputs.publish == 'true' && needs.publish.result == 'success') ||
        needs.resolve.outputs.release-out-of-date == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Find the commit that built the image
        id: target
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          target_sha="$GITHUB_SHA"

          if [ "$PUBLISH_RESULT" != "success" ]; then
            revision=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Image}}' \
              | jq -r '[.. | .Labels? | objects | .["org.opencontainers.image.revision"] | strings] | first // empty' || true)

            if [ -n "$revision" ]; then
              target_sha="$revision"
            else
              echo "::warning::$IMAGE:$VERSION has no revision label; tagging $GITHUB_SHA"
            fi
          fi

          echo "Release target: $target_sha"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Create or update the GitHub Release
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          IS_LATEST: ${{ needs.resolve.outputs.is-latest }}
          IS_LATEST_IN_MINOR: ${{ needs.resolve.outputs.is-latest-in-minor }}
          TWENTY_TAG: ${{ needs.resolve.outputs.twenty-tag }}
        run: |
          release_tag="upshift/$VERSION"

          image_tags="\`$VERSION\`"
          if [ "$IS_LATEST_IN_MINOR" = "true" ]; then
            image_tags="$image_tags, \`${VERSION%.*}\`"
          fi
          if [ "$IS_LATEST" = "true" ]; then
            image_tags="$image_tags, \`${VERSION%%.*}\`, \`latest\`"
          fi

          {
            echo "Upshift **$VERSION**, built on Twenty [\`$TWENTY_TAG\`](https://github.com/twentyhq/twenty/tree/$TWENTY_TAG) with the Upshift layer from $TARGET_SHA."
            echo
            echo "### Docker image"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Image tags: $image_tags (amd64 and arm64)."
            echo
            echo "### Upgrade a deployment"
            echo
            echo "Set \`TAG=$VERSION\` in \`upshift/docker/.env\`, then run \`docker compose pull && docker compose up -d\`. Database migrations run automatically when the server starts."
            echo
            echo "### What changed"
            echo
            if [ "${VERSION##*.}" = "0" ]; then
              echo "See Twenty's [${VERSION%.*} release notes](https://github.com/twentyhq/twenty/releases/tag/twenty/${VERSION%.*}.0)."
            else
              echo "This patch version ships fixes on top of Twenty ${VERSION%.*}.0; see its [release notes](https://github.com/twentyhq/twenty/releases/tag/twenty/${VERSION%.*}.0)."
            fi
          } > release-notes.md

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md --latest="$IS_LATEST"
            # The tag moves last: the next run retries the whole update until it points at the image's commit
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag" -f sha="$TARGET_SHA" -F force=true > /dev/null \
              || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$release_tag" -f sha="$TARGET_SHA" > /dev/null
            action=Updated
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" --title "Upshift $VERSION" \
              --notes-file release-notes.md --latest="$IS_LATEST"
            action=Created
          fi

          echo "### $action release [$release_tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$release_tag)" >> "$GITHUB_STEP_SUMMARY"
