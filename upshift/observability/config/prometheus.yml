global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: upshift-monitoring
    static_configs:
      - targets: ['gateway:9090']
  - job_name: monitoring-backends
    static_configs:
      - targets: ['loki:3100', 'tempo:3200', 'mimir:9009']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'process_.*|go_memstats_.*'
        action: keep
