auth_enabled: true
server:
  http_listen_port: 3100
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: object-storage:8333
      bucketnames: upshift-logs
      access_key_id: ${S3_ACCESS_KEY_ID}
      secret_access_key: ${S3_SECRET_ACCESS_KEY}
      insecure: true
      s3forcepathstyle: true
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache
ingester:
  wal:
    enabled: true
    dir: /loki/wal
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 1h
  delete_request_store: s3
limits_config:
  retention_period: 168h
  ingestion_rate_mb: 0.125
  ingestion_burst_size_mb: 1
  max_global_streams_per_user: 100
  max_label_names_per_series: 8
  max_label_value_length: 128
  max_line_size: 2048
  max_structured_metadata_size: 4096
  max_structured_metadata_entries_count: 16
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name, deployment.environment.name]
        - action: structured_metadata
          attributes: [upshift.observability.schema]
        - action: drop
          regex: .*
    scope_attributes:
      - action: drop
        regex: .*
    log_attributes:
      - action: structured_metadata
        attributes:
          [
            http.request.method,
            http.route,
            http.response.status_code,
            upshift.duration_ms,
            error.type,
          ]
      - action: drop
        regex: .*
analytics:
  reporting_enabled: false
