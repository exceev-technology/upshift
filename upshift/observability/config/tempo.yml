multitenancy_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
  complete_block_timeout: 10m
compactor:
  compaction:
    block_retention: 72h
storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    s3:
      bucket: upshift-traces
      endpoint: object-storage:8333
      access_key: ${S3_ACCESS_KEY_ID}
      secret_key: ${S3_SECRET_ACCESS_KEY}
      insecure: true
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 131072
      burst_size_bytes: 1048576
      max_traces_per_user: 2000
    global:
      max_bytes_per_trace: 65536
usage_report:
  reporting_enabled: false
