multitenancy_enabled: true
server:
  http_listen_port: 9009
  log_level: warn
common:
  storage:
    backend: s3
    s3:
      endpoint: object-storage:8333
      access_key_id: ${S3_ACCESS_KEY_ID}
      secret_access_key: ${S3_SECRET_ACCESS_KEY}
      insecure: true
blocks_storage:
  s3:
    bucket_name: upshift-metrics
  tsdb:
    dir: /var/mimir/tsdb
  bucket_store:
    sync_dir: /var/mimir/tsdb-sync
compactor:
  data_dir: /var/mimir/compactor
  sharding_ring:
    kvstore:
      store: inmemory
    wait_stability_min_duration: 0s
    wait_stability_max_duration: 0s
ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1
    final_sleep: 0s
store_gateway:
  sharding_ring:
    kvstore:
      store: inmemory
    replication_factor: 1
ruler_storage:
  s3:
    bucket_name: upshift-metrics-ruler
alertmanager_storage:
  s3:
    bucket_name: upshift-metrics-alertmanager
alertmanager:
  data_dir: /var/mimir/alertmanager
ruler:
  rule_path: /var/mimir/rules
limits:
  compactor_blocks_retention_period: 720h
  ingestion_rate: 1000
  ingestion_burst_size: 10000
  max_global_series_per_user: 5000
  max_global_series_per_metric: 2000
  max_label_names_per_series: 16
  max_label_value_length: 128
  max_global_exemplars_per_user: 1000
  max_query_parallelism: 4
  max_fetched_series_per_query: 10000
usage_stats:
  enabled: false
