services:
  prometheus:
    volumes: ['./test/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro']
  alloy:
    image: grafana/alloy:v1.11.3
    command:
      [
        run,
        --disable-reporting,
        --server.http.listen-addr=0.0.0.0:12345,
        /etc/alloy/config.alloy,
      ]
    environment:
      UPSHIFT_MONITORING_URL: http://gateway:8080
      UPSHIFT_MONITORING_TOKEN: ${TEST_TOKEN:?}
    volumes: ['./client/config.alloy:/etc/alloy/config.alloy:ro']
    networks: [storage]
  runner:
    build: ./gateway
    command: [node, /test/integration.mjs]
    environment:
      TEST_TOKEN: ${TEST_TOKEN:?}
      TEST_OTHER_TOKEN: ${TEST_OTHER_TOKEN:?}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    volumes: ['./test:/test:ro', './instrumentation:/instrumentation:ro']
    networks: [storage]
    profiles: [test]
  alert-sink:
    build: ./gateway
    command: [node, /test/alert-sink.mjs]
    volumes: ['./test:/test:ro']
    networks: [storage]
