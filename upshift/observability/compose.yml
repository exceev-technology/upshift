name: upshift-monitoring

x-storage-environment: &storage-environment
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  object-storage:
    logging: *bounded-logs
    image: chrislusf/seaweedfs:4.17
    command:
      [
        mini,
        -dir=/data,
        -master.telemetry=false,
        -admin.ui=false,
        -webdav=false,
        -s3.port.iceberg=0,
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    volumes: [object-data:/data]
    restart: unless-stopped
    networks: [storage]

  buckets:
    logging: *bounded-logs
    build: ./gateway
    environment: *storage-environment
    command: [node, init-storage.mjs]
    depends_on: [object-storage]
    networks: [storage]
    restart: 'no'

  loki:
    logging: *bounded-logs
    image: grafana/loki:3.5.12
    command: [-config.file=/etc/loki/config.yml, -config.expand-env=true]
    environment: *storage-environment
    volumes: ['./config/loki.yml:/etc/loki/config.yml:ro', 'loki-data:/loki']
    depends_on:
      buckets: { condition: service_completed_successfully }
    networks: [storage]
    restart: unless-stopped

  tempo:
    logging: *bounded-logs
    image: grafana/tempo:2.8.4
    command: [-config.file=/etc/tempo/config.yml, -config.expand-env=true]
    environment: *storage-environment
    volumes:
      ['./config/tempo.yml:/etc/tempo/config.yml:ro', 'tempo-data:/var/tempo']
    depends_on:
      buckets: { condition: service_completed_successfully }
    networks: [storage]
    restart: unless-stopped

  mimir:
    logging: *bounded-logs
    image: grafana/mimir:2.17.11
    command:
      [-config.file=/etc/mimir/config.yml, -config.expand-env=true, -target=all]
    environment: *storage-environment
    volumes:
      ['./config/mimir.yml:/etc/mimir/config.yml:ro', 'mimir-data:/var/mimir']
    depends_on:
      buckets: { condition: service_completed_successfully }
    networks: [storage]
    restart: unless-stopped

  gateway:
    logging: *bounded-logs
    build: ./gateway
    environment:
      <<: *storage-environment
      MONITORING_TENANTS_JSON: ${MONITORING_TENANTS_JSON:?}
    volumes: ['object-data:/storage:ro', 'datasources:/app/provisioning']
    expose: ['8080']
    depends_on:
      buckets: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [default, storage]
    restart: unless-stopped

  grafana:
    logging: *bounded-logs
    image: grafana/grafana:12.2.10
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:?}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_SECURITY_COOKIE_SECURE: 'true'
    volumes:
      - grafana-data:/var/lib/grafana
      - datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/upshift.yml:ro
      - ./config/grafana/overview.json:/var/lib/grafana/dashboards/overview.json:ro
      - ./config/grafana/client.json:/var/lib/grafana/dashboards/client.json:ro
    expose: ['3000']
    depends_on:
      gateway: { condition: service_healthy }
    networks: [default, storage]
    restart: unless-stopped

  prometheus:
    logging: *bounded-logs
    image: prom/prometheus:v3.7.1
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=7d,
        --storage.tsdb.retention.size=1GB,
      ]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [storage]
    restart: unless-stopped

  alertmanager:
    logging: *bounded-logs
    image: prom/alertmanager:v0.28.1
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        test -n "$$ALERT_WEBHOOK_URL"
        printf '%s' "$$ALERT_WEBHOOK_URL" > /tmp/webhook-url
        exec /bin/alertmanager --config.file=/etc/alertmanager/config.yml --storage.path=/alertmanager
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?}
    volumes:
      [
        './config/alertmanager.yml:/etc/alertmanager/config.yml:ro',
        'alertmanager-data:/alertmanager',
      ]
    networks: [default, storage]
    restart: unless-stopped

networks:
  storage:
    internal: true

volumes:
  object-data:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  datasources:
