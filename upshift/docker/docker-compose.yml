name: upshift

x-upshift-environment: &upshift-environment
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
  SERVER_URL: ${SERVER_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}

  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}

  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
  APP_SECRET: ${APP_SECRET:-}

  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Upshift}
  # Uncomment once SMTP is configured in .env; empty values fail the server's config validation
  # EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
  # EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
  # EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
  # EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
  # EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
  # EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}

  TELEMETRY_ENABLED: "false"
  ALLOW_REQUESTS_TO_TWENTY_ICONS: "false"

services:
  server:
    image: ghcr.io/exceev-technology/upshift:${TAG:-latest}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "${UPSHIFT_PORT:-3000}:3000"
    environment:
      <<: *upshift-environment
      NODE_PORT: 3000
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-false}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: always

  worker:
    image: ghcr.io/exceev-technology/upshift:${TAG:-latest}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      <<: *upshift-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  db-data:
  server-local-data:
